name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue. / 感谢提第一个 issue。

            Please skim the README before we dig in. / 动手前先看一眼 README。
          pr-message: |
            Thanks for your first PR. / 感谢提第一个 PR。

            Please check the README for setup and contribution notes. / 请先对照 README 的安装与说明。
