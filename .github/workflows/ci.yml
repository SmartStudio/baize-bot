name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baize
          POSTGRES_PASSWORD: baize
          POSTGRES_DB: baize
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U baize -d baize"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://baize:baize@localhost:5434/baize

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Ubuntu 24.04 的 AppArmor 不许普通进程建 user namespace，云电脑的 bash 沙箱（bwrap）和助理 Chrome 都靠它。
      # 按 Chromium 的 apparmor-userns-restrictions 文档只给这两个程序放开，不整机关 apparmor_restrict_unprivileged_userns。
      # AppArmor 按真实路径匹配，/usr/bin/chromium 是软链，先解析。末尾真起一次，没放开就停在这一步。
      - name: 给 bwrap 和 Chrome 放开 user namespace
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          for entry in "baize-bwrap $(readlink -f /usr/bin/bwrap)" "baize-chrome $(readlink -f /usr/bin/chromium)"; do
            set -- $entry
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile %s %s flags=(unconfined) {\n  userns,\n}\n' "$1" "$2" |
              sudo tee "/etc/apparmor.d/$1" >/dev/null
            sudo apparmor_parser -r "/etc/apparmor.d/$1"
          done
          bwrap --ro-bind / / --dev /dev --unshare-all true
          timeout 30 /usr/bin/chromium --headless=new --no-first-run --user-data-dir="$(mktemp -d)" --dump-dom about:blank >/dev/null

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check && pnpm check
