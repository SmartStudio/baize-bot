name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baize
          POSTGRES_PASSWORD: baize
          POSTGRES_DB: baize
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U baize -d baize"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://baize:baize@localhost:5434/baize

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Ubuntu 23.10 起 AppArmor 默认不许普通进程建 user namespace（kernel.apparmor_restrict_unprivileged_userns=1），
      # 云电脑的 bash 沙箱（bwrap）和助理 Chrome 都靠它。按 Chromium 的 apparmor-userns-restrictions 文档只给这两个程序
      # 放开，不整机关这个 sysctl。Ubuntu 26.04 的 apparmor 包自带 bwrap-userns-restrict，已经放行 /usr/bin/bwrap；
      # 同一路径再挂一份 profile 两份冲突，exec 时一份都不用，bwrap 建的 user namespace 拿不到 capability，
      # 配回环口报 RTM_NEWADDR 失败（#135）。所以先照原样起一次，起不来才补 profile，补完再起一次，还不通就停在这一步。
      # bwrap 用运行器探测沙箱的参数（bot-runner/src/sandbox.ts 的 BWRAP_PROBE_ARGS），探不通 Linux 上的沙箱用例会全跳过。
      # AppArmor 按真实路径匹配，/usr/bin/chromium 是软链，先解析。
      # 新 runner 上第一次起 Chrome 要 9 到 45 秒，之后一秒左右，这一次也替后面的用例预热，上限放宽到 120 秒。
      - name: 给 bwrap 和 Chrome 放开 user namespace
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          allow_userns() {
            name=$1
            binary=$(readlink -f "$2")
            shift 2
            if "$@" >/dev/null 2>&1; then
              echo "$binary 不加 profile 就能建 user namespace"
              return
            fi
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile %s %s flags=(unconfined) {\n  userns,\n}\n' "$name" "$binary" |
              sudo tee "/etc/apparmor.d/$name" >/dev/null
            sudo apparmor_parser -r "/etc/apparmor.d/$name"
            "$@" >/dev/null
            echo "$binary 补了 profile $name"
          }
          allow_userns baize-bwrap /usr/bin/bwrap \
            bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-net true
          allow_userns baize-chrome /usr/bin/chromium \
            timeout 120 /usr/bin/chromium --headless=new --no-first-run --user-data-dir="$(mktemp -d)" --dump-dom about:blank

      # Linux 上助理 Chrome 按远程电脑的方式起，要一块 Xvfb 屏（computer-agent/src/chrome.ts 认 DISPLAY）。
      - name: 起 Xvfb
        run: |
          sudo apt-get install -y -q xvfb
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check && pnpm check
