name: diag

on:
  push:
    branches: [joesmart/ci-red]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 环境
        run: |
          uname -a; head -3 /etc/os-release; id
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          which bwrap chromium chromium-browser google-chrome || true
          ls -l /usr/bin/chromium || true; readlink -f /usr/bin/chromium || true
          ls -ld /Users || true
          mkdir -p /Users/zouyanjian/x 2>&1 || true
      - name: 改之前的 Chrome
        run: |
          timeout 30 /usr/bin/chromium --headless=new --no-first-run --user-data-dir=$(mktemp -d) --dump-dom about:blank; echo "exit=$?"
      - name: 装 bubblewrap，改之前探测
        run: |
          sudo apt-get install -y bubblewrap >/dev/null 2>&1; bwrap --version
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-net true; echo "exit=$?"
      - name: 放开非特权 user namespace 后再探
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-net true; echo "bwrap exit=$?"
          timeout 30 /usr/bin/chromium --headless=new --no-first-run --user-data-dir=$(mktemp -d) --dump-dom about:blank; echo "chrome exit=$?"

  web-streaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @baize/web exec playwright test e2e/05-streaming.spec.ts --reporter=line
