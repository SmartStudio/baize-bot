# 控制面、Postgres 和一台远程电脑。用法和要准备的东西见同目录 README.md。
# 项目名写死成 baize-remote，和仓库根的 baize 项目（baize-postgres 容器）互不相干。
name: baize-remote

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: baize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baize}
      POSTGRES_DB: baize
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baize -d baize"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 每次 up 先跑一遍迁移，已应用的跳过。控制面起来时表一定在。
  migrate:
    image: baize-control-plane:remote
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://baize:${POSTGRES_PASSWORD:-baize}@postgres:5432/baize
    command: ["node", "--import", "tsx", "src/scripts/migrate.ts"]
    restart: "no"

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/remote/Dockerfile
      target: control-plane
    image: baize-control-plane:remote
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://baize:${POSTGRES_PASSWORD:-baize}@postgres:5432/baize
      PORT: "3001"
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?要设上游地址}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?要设上游 key}
      GATEWAY_MODELS: ${GATEWAY_MODELS:-plan=baize-default,fast=baize-default}
      # 工具认证信息的加密密钥，64 位十六进制。换了它，已存的凭据全部解不开。
      TOOL_SECRET_KEY: ${TOOL_SECRET_KEY:?要设工具凭据的加密密钥}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # 平台账号令牌的加密密钥，32 字节 base64。换了它，已存的令牌全部解不开。
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?缺 CREDENTIALS_KEY}
      # 浏览器打开 Web 的地址，OAuth 回调拼在它上面。控制面自己推不出浏览器到得了的地址，所以必填。
      WEB_BASE_URL: ${WEB_BASE_URL:?缺 WEB_BASE_URL}
      # 两家 OAuth 应用。不设的那家，账号页点连接回 503。
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      # 每百万输入、输出 token 的价，折算 run 的花费。不设就是 0，用量金额恒为 0。
      PRICE_INPUT_PER_M: ${PRICE_INPUT_PER_M:-0}
      PRICE_OUTPUT_PER_M: ${PRICE_OUTPUT_PER_M:-0}
      # 平台接口和授权页的根地址，默认官方地址，只在验证时指到假平台。
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      X_API_BASE_URL: ${X_API_BASE_URL:-https://api.x.com}
      GITHUB_OAUTH_BASE_URL: ${GITHUB_OAUTH_BASE_URL:-https://github.com}
      X_OAUTH_BASE_URL: ${X_OAUTH_BASE_URL:-https://x.com}
    # 只绑本机回环，对外由宿主机上的反向代理终结 TLS 再转进来。docker 发布到 0.0.0.0 的端口会绕过 ufw。
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-3201}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  remote-computer:
    build:
      context: ../..
      dockerfile: deploy/remote/Dockerfile
      target: remote-computer
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: baize-remote-computer:remote
    depends_on:
      - control-plane
    # 只放开 bubblewrap 和 Chromium 沙箱建命名空间要的几个系统调用，不给 privileged，不加 CAP_SYS_ADMIN。
    security_opt:
      - seccomp=./seccomp-bwrap.json
      - apparmor=unconfined
    init: true
    # 看护进程给代理 15 秒收尾，docker 默认 10 秒就 SIGKILL。
    stop_grace_period: 20s
    shm_size: 1gb
    # 启动文件放这里：内存盘，只有 node 用户能进，容器一停就没了。
    tmpfs:
      - /run/baize:uid=1000,gid=1000,mode=0700
    volumes:
      - bots:/home/node/.baize/bots
    restart: unless-stopped

volumes:
  pgdata:
  bots:
