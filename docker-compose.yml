services:
  postgres:
    image: postgres:16
    container_name: baize-postgres
    environment:
      POSTGRES_USER: baize
      POSTGRES_PASSWORD: baize
      POSTGRES_DB: baize
    ports:
      - "5434:5432"
    volumes:
      - baize-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baize -d baize"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  baize-pgdata:
