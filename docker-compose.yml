# 项目名写死。不写的话跟着目录走，每个 git 工作树都成一个新项目，容器名却写死是 baize-postgres，第二个工作树里 up 就撞名。
name: baize

services:
  postgres:
    image: postgres:16
    container_name: baize-postgres
    environment:
      POSTGRES_USER: baize
      POSTGRES_PASSWORD: baize
      POSTGRES_DB: baize
    ports:
      - "5434:5432"
    volumes:
      - baize-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baize -d baize"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  baize-pgdata:
